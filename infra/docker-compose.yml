services:
  auth-db:
    image: postgres:16-alpine
    container_name: careflow-auth-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: careflow_auth
      POSTGRES_USER: careflow
      POSTGRES_PASSWORD: careflow
    ports:
      - "${CAREFLOW_AUTH_DB_PORT:-55432}:5432"
    volumes:
      - careflow_auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careflow -d careflow_auth"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  careflow_auth_postgres_data:
